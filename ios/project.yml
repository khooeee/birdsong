name: Birdsong
options:
  bundleIdPrefix: com.khooeee
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  # Marks the project as checked against this Xcode, so it stops offering "recommended settings".
  xcodeVersion: "27.2"
packages:
  # Google's libwebrtc, prebuilt: the voice call's audio goes from the phone straight to Inworld.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Xcode's recommended settings, kept here so regenerating doesn't undo them.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  Birdsong:
    type: application
    platform: iOS
    sources:
      - path: Birdsong
    dependencies:
      - package: WebRTC
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.khooeee.birdsong
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Birdsong
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: Talk to Birdsong's voice agent about your sessions.
        # Voice keeps hearing and talking with the screen locked or another app open.
        UIBackgroundModes: [audio]
        UIApplicationSupportsIndirectInputEvents: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Tapping a pairing link (birdsong://<mac>.ts.net?token=…) opens the app.
        CFBundleURLTypes:
          - CFBundleURLName: com.khooeee.birdsong.pair
            CFBundleURLSchemes: [birdsong]
        # Plain http only to localhost, for the simulator; the tailnet is https via tailscale serve.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
